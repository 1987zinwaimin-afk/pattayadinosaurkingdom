<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d35"><title>Staff Check-in — Ticket Desk</title><link rel="stylesheet" href="style.css?v=staff-checkin-20261018a"></head>
<body><main class="main" style="max-width:680px;margin:24px auto;padding:16px"><section class="panel"><h1 id="title">Staff Check-in</h1><p id="intro" class="muted">Choose your name and department before entering.</p><form id="staffForm" class="form-grid"><div class="field full"><label id="nameLabel" for="staffName">Staff name</label><input id="staffName" maxlength="80" autocomplete="name" required></div><div class="field full"><label id="deptLabel" for="staffDept">Department</label><select id="staffDept" class="date-input"><option value="sales">Sales Department</option><option value="entry">Entry Ticket Department</option><option value="playing">Playing Ticket Department</option><option value="event">Event Ticket Department</option></select></div><div class="field full"><label id="langLabel" for="lang">Language / ภาษา</label><select id="lang" class="date-input"><option value="en">English</option><option value="th">ภาษาไทย</option></select></div><div class="field full"><button id="enterBtn" class="btn btn-primary" type="submit">Enter Ticket Desk</button></div></form><p id="status" class="notice" role="status">This check-in records the name and department you choose. It does not verify your identity.</p></section></main><script type="module" src="staff-checkin.js?v=20261018a"></script></body></html>
