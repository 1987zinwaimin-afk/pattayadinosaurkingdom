<body><main style="max-width:560px;margin:32px auto;padding:18px"><section class="panel">

<h1 id="title" style="text-align:center;margin-top:0">Staff Check-in</h1><p id="desc" class="muted">Select your name and department to record your check-in.</p><form id="checkinForm" class="form-grid"><div class="field full"><label for="staffName" id="nameLabel">Your name</label><input id="staffName" maxlength="80" required autocomplete="name"></div><div class="field full"><label for="department" id="deptLabel">Department</label><select id="department" required><option value="sales">Sales Department</option><option value="entry">Entry Department</option><option value="playing">Playing Department</option><option value="event">Event Department</option><option value="leader">Leader — All Departments</option></select></div><div class="field full" id="leaderApprovalField" hidden><label id="leaderApprovalLabel">Owner approval password</label><div class="pin-inputs" id="leaderPinInputs"><input class="pin-digit" type="password" inputmode="numeric" maxlength="1" autocomplete="off"><input class="pin-digit" type="password" inputmode="numeric" maxlength="1" autocomplete="off"><input class="pin-digit" type="password" inputmode="numeric" maxlength="1" autocomplete="off"><input class="pin-digit" type="password" inputmode="numeric" maxlength="1" autocomplete="off"></div><input id="leaderApprovalPassword" type="hidden"></div><div class="field full"><label for="language" id="langLabel">Language</label><select id="language"><option value="en">English</option><option value="th">ภาษาไทย</option></select></div><div class="field full"><button class="btn btn-primary" id="submitBtn" type="submit">Check in</button></div></form><p id="status" class="notice" role="status" hidden></p><p class="help-text">This records the name and department entered here; it does not independently verify a person's identity.</p></section></main><script type="module" src="staff-portal.js?v=leader-pin-boxes-20261019a"></script></body></html>
