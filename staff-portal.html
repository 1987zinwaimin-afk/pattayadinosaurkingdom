<h1 id="title" style="text-align:center;margin-top:0">Staff Check-in</h1><p id="desc" class="muted">Select your name and department to record your check-in.</p><div style="margin:0 0 20px;padding:14px;border:2px solid #d7a62a;border-radius:14px;background:#fff8e6"><button class="btn btn-gold" id="installAppButton" type="button" style="display:block;width:100%;min-height:52px;padding:14px 12px;background:#d7a62a;color:#101d35;border:0;border-radius:10px;font-size:16px;font-weight:800;visibility:visible;opacity:1">⬇ Download here · Install on Home Screen</button><p class="help-text" style="text-align:center;margin:8px 0 0">Install Staff Check-in on this phone for quick access.</p></div><form id="checkinForm" class="form-grid"><div class="field full"><label for="staffName" id="nameLabel">Your name</label><input id="staffName" maxlength="80" required autocomplete="name"></div><div class="field full"><label for="department" id="deptLabel">Department</label><select id="department" required><option value="sales">Sales Department</option><option value="entry">Entry Department</option><option value="playing">Playing Department</option><option value="event">Event Department</option><option value="leader">Leader — All Departments</option></select></div><div class="field full" id="leaderApprovalField" hidden><label for="leaderApprovalPassword" id="leaderApprovalLabel">Owner approval password</label><input id="leaderApprovalPassword" type="password" autocomplete="off" inputmode="numeric" maxlength="4" placeholder="Enter password"></div><div class="field full"><label for="language" id="langLabel">Language</label><select id="language"><option value="en">English</option><option value="th">ภาษาไทย</option></select></div><div class="field full"><button class="btn btn-primary" id="submitBtn" type="submit">Check in</button></div></form><p id="status" class="notice" role="status" hidden></p><p class="help-text">This records the name and department entered here; it does not independently verify a person's identity.</p></section></main><script src="pwa.js?v=staff-install-20261019b"></script><script type="module" src="staff-portal.js?v=staff-account-tracking-20261019a"></script></body></html>
