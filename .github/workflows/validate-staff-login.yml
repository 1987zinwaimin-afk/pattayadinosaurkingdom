name: Validate staff login changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [staff-login-foundation]

jobs:
  syntax-and-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app JavaScript syntax
        run: node --check app.js
      - name: Check Firebase module syntax
        run: node --input-type=module --check < firebase-auth.js
      - name: Check HTML shell and auth gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          for (const id of ['ownerAuthGate', 'staffLoginForm', 'ownerLoginForm', 'staffDepartment', 'appContent']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing required element: ' + id);
          }
          const shellCount = (html.match(/class="app-shell"/g) || []).length;
          if (shellCount !== 1) throw new Error('Expected exactly one app-shell wrapper; found ' + shellCount);
          if (!html.includes('firebase-auth.js')) throw new Error('Firebase auth module is not loaded');
          console.log('Login gate and app shell checks passed.');
          NODE

      - name: Check Owner action guards and staff role handling
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app = fs.readFileSync('app.js', 'utf8');
          const auth = fs.readFileSync('firebase-auth.js', 'utf8');
          const rules = fs.readFileSync('firestore.rules', 'utf8');
          const requiredGuards = [
            ["ticket deletion", "if(!await requireOwnerAction('Only Owner can delete tickets.'))return;"],
            ["saved report deletion", "if(!await requireOwnerAction('Only Owner can delete saved reports.'))return;"],
            ["daily quantity reset", "if(!await requireOwnerAction('Only Owner can reset daily quantities.'))return;"],
            ["single quantity clear", "if(clearQty){if(!await requireOwnerAction('Only Owner can clear ticket quantities.'))return;"],
            ["backup restore", "async function importBackup(file){if(!await requireOwnerAction('Only Owner can restore a backup.'))return;"]
          ];
          for (const [label, token] of requiredGuards) {
            if (!app.includes(token)) throw new Error('Missing Owner Delete Password guard: ' + label);
          }
          if (!app.includes("async function deleteReport(id){if(!await requireOwnerAction('Only Owner can delete saved reports.'))return;")) {
            throw new Error('Saved report deletion is not protected.');
          }
          if (!auth.includes('if (old.name !== name)')) throw new Error('Existing staff name validation is missing.');
          if (auth.includes('old.name !== name || old.department !== department')) {
            throw new Error('Login form can override/block the Owner-approved staff role.');
          }
          if (!auth.includes('if (!["sales", "entry", "playing", "event", "leader"].includes(department))')) {
            throw new Error('Owner role editor does not accept the Leader role.');
          }
          if (!rules.includes('match /ownerSettings/{settingId}') || !rules.includes('allow read, write: if isOwner();')) {
            throw new Error('Owner Delete Password settings are not Owner-only in Firestore rules.');
          }
          console.log('Destructive-action guards, Owner settings rules, and staff role checks passed.');
          NODE
